<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182c20"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" stroke="#274734" stroke-width="12"/>
  
  <!-- Outer Tactical Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#366147" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#274734" stroke-width="3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#366147" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Tactical Reticle Axis Lines -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#457c5a" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#457c5a" stroke-width="2" opacity="0.4"/>
  
  <!-- Stylized V Defense Chevron -->
  <polygon points="256,380 140,160 190,160 256,290 322,160 372,160" fill="#a4cbb4" stroke="#457c5a" stroke-width="6"/>
  
  <!-- Center Target Core -->
  <circle cx="256" cy="256" r="10" fill="#ef4444"/>
  <circle cx="256" cy="256" r="22" fill="none" stroke="#ef4444" stroke-width="2"/>
</svg>
